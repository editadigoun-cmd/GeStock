name: Deploy GeStock Admin to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - "admin/**"
      - ".github/workflows/deploy-gestock-admin.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gestock-admin-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: admin
    env:
      CLOUDFLARE_ACCOUNT_ID: ed1783922fcd87086ef7757e242fc0f2
      ADMIN_EMAIL: editadigoun@gmail.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install current admin dependencies
        run: npm install
      - name: Dependency audit report (non-blocking until remediation)
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const a=require('./npm-audit.json'); console.log('Audit severity counts:', JSON.stringify(a.metadata?.vulnerabilities)); for (const [name,v] of Object.entries(a.vulnerabilities||{})) { console.log(name, v.severity, v.range, 'fixAvailable=', JSON.stringify(v.fixAvailable)); for (const via of v.via||[]) if (typeof via==='object') console.log('  ',via.title,via.url||''); }"
      - name: Check Next.js compatibility with vinext
        run: npx --yes vinext check
      - name: Configure Cloudflare Workers deployment
        run: npx --yes vinext init --platform=cloudflare --name gestock-admin --cdn-cache=none --data-cache=none --image-optimization=none
      - name: Upgrade Cloudflare Vite plugin for Build Output v1
        run: npm install --no-save @cloudflare/vite-plugin@rc
      - name: Apply compatible dependency security updates (leave incompatible fixes for review)
        run: npm audit fix || true
      - name: Block high-severity admin dependency advisories
        run: npm audit --audit-level=high
      - name: Build admin application
        run: npm run build:vinext
      - name: Deploy admin to Cloudflare Workers
        run: npx --yes @vinext/cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Configure GeStock API runtime binding
        run: printf '%s' "$GESTOCK_API_URL" | npx --yes wrangler secret put GESTOCK_API_URL --name gestock-admin
        env:
          GESTOCK_API_URL: https://gestock-api.ccds22431.workers.dev
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify Cloudflare Access edge enforcement before trusting identity headers
        run: |
          headers=$(mktemp)
          status=$(curl --silent --show-error --max-time 30 --dump-header "$headers" --output /dev/null --write-out '%{http_code}' https://gestock-admin.ccds22431.workers.dev/login)
          location=$(grep -i '^location:' "$headers" | tail -n 1 | sed 's/^[Ll]ocation:[[:space:]]*//;s/\r$//')
          echo "Access probe status: $status"
          echo "Access redirect: $location"
          case "$status" in
            302|303|307|308) ;;
            *) echo "::error::Expected an Access redirect; refusing to trust Access identity headers."; exit 1 ;;
          esac
          if ! printf '%s' "$location" | grep -qi 'cloudflareaccess.com'; then
            echo "::error::The edge redirect did not target the Cloudflare Access login domain."
            exit 1
          fi
      - name: Configure Access identity binding only after edge enforcement is verified
        run: printf '%s' "true" | npx --yes wrangler secret put CLOUDFLARE_ACCESS_ENABLED --name gestock-admin
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
