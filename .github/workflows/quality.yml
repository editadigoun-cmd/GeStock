name: GeStock quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: mobile
      - run: flutter analyze --no-fatal-infos
        working-directory: mobile
      - run: flutter test
        working-directory: mobile
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
        working-directory: backend
      - name: Dependency audit report (non-blocking until remediation)
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const a=require('./npm-audit.json'); console.log('Audit severity counts:', JSON.stringify(a.metadata?.vulnerabilities)); for (const [name,v] of Object.entries(a.vulnerabilities||{})) { console.log(name, v.severity, v.range, 'fixAvailable=', JSON.stringify(v.fixAvailable)); for (const via of v.via||[]) if (typeof via==='object') console.log('  ',via.title,via.url||''); }"
        working-directory: backend
      - run: npm run typecheck
        working-directory: backend
      - run: npm run test
        working-directory: backend
  deploy:
    needs: [backend, flutter]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ed1783922fcd87086ef7757e242fc0f2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
        working-directory: backend
      - name: Apply D1 database migrations
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: backend
          command: d1 migrations apply gestock-db --remote
      - name: Deploy GeStock API to Cloudflare
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: backend
          command: deploy
      - name: Verify deployed API health
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          curl --fail --silent --show-error --max-time 30 https://gestock-api.ccds22431.workers.dev/health | jq -e '.ok == true and .service == "gestock-api"'
          curl --fail --silent --show-error --max-time 30 https://gestock-api.ccds22431.workers.dev/health/d1 | jq -e '.ok == true and .database == "gestock-db" and .table_count >= 26 and .auth_schema_ready == true'
          auth_status=$(curl --silent --show-error --max-time 30 --output /tmp/auth-smoke.json --write-out '%{http_code}' -H 'Content-Type: application/json' -X POST https://gestock-api.ccds22431.workers.dev/auth/login -d '{"email":"smoke-test@example.invalid","password":"NotARealPassword123"}')
          test "$auth_status" = "401" || { echo "Expected invalid credentials (401), got $auth_status"; cat /tmp/auth-smoke.json; exit 1; }
      - name: Exercise Cloudflare auth registration, login, password change, logout and clean test account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          email="gestock-ci-${GITHUB_RUN_ID}@example.invalid"
          password="Test-pass-${GITHUB_RUN_ID}-A"
          new_password="Test-pass-${GITHUB_RUN_ID}-B"
          ip=$(curl --silent --show-error --max-time 10 https://api.ipify.org)
          register_hash=$(printf 'register:%s' "$ip" | openssl dgst -sha256 -binary | base64 | tr -d '=\n')
          login_hash=$(printf 'login:%s:%s' "$email" "$ip" | openssl dgst -sha256 -binary | base64 | tr -d '=\n')
          cleanup() {
            npx wrangler d1 execute gestock-db --remote --command "DELETE FROM auth_sessions WHERE user_id IN (SELECT id FROM app_users WHERE email='$email');" || true
            npx wrangler d1 execute gestock-db --remote --command "DELETE FROM app_users WHERE email='$email';" || true
            npx wrangler d1 execute gestock-db --remote --command "DELETE FROM auth_rate_limits WHERE key_hash IN ('$register_hash','$login_hash');" || true
          }
          trap cleanup EXIT
          payload=$(jq -nc --arg name "CI Test" --arg email "$email" --arg password "$password" '{name:$name,email:$email,password:$password}')
          register=$(curl --silent --show-error --max-time 30 --write-out '\n%{http_code}' -H 'Content-Type: application/json' -X POST https://gestock-api.ccds22431.workers.dev/auth/register -d "$payload")
          code=$(printf '%s' "$register" | tail -n1)
          body=$(printf '%s' "$register" | sed '$d')
          test "$code" = "201" || { echo "Register expected 201, got $code"; echo "$body"; exit 1; }
          token=$(printf '%s' "$body" | jq -er '.data.token')
          payload=$(jq -nc --arg email "$email" --arg password "$password" '{email:$email,password:$password}')
          login=$(curl --fail --silent --show-error --max-time 30 -H 'Content-Type: application/json' -X POST https://gestock-api.ccds22431.workers.dev/auth/login -d "$payload")
          login_token=$(printf '%s' "$login" | jq -er '.data.token')
          me=$(curl --fail --silent --show-error --max-time 30 -H "Authorization: Bearer $login_token" https://gestock-api.ccds22431.workers.dev/auth/me)
          echo "$me" | jq -e --arg email "$email" '.data.user.email == $email'
          payload=$(jq -nc --arg current "$password" --arg next "$new_password" '{currentPassword:$current,newPassword:$next}')
          curl --fail --silent --show-error --max-time 30 -H 'Content-Type: application/json' -H "Authorization: Bearer $login_token" -X POST https://gestock-api.ccds22431.workers.dev/auth/change-password -d "$payload" | jq -e '.ok == true'
          payload=$(jq -nc --arg email "$email" --arg password "$new_password" '{email:$email,password:$password}')
          new_login=$(curl --fail --silent --show-error --max-time 30 -H 'Content-Type: application/json' -X POST https://gestock-api.ccds22431.workers.dev/auth/login -d "$payload")
          new_token=$(printf '%s' "$new_login" | jq -er '.data.token')
          payload=$(jq -nc --arg email "$email" --arg password "$password" '{email:$email,password:$password}')
          old_status=$(curl --silent --show-error --max-time 30 -o /tmp/auth-old.json -w '%{http_code}' -H 'Content-Type: application/json' -X POST https://gestock-api.ccds22431.workers.dev/auth/login -d "$payload")
          test "$old_status" = "401"
          curl --fail --silent --show-error --max-time 30 -H "Authorization: Bearer $new_token" -X POST https://gestock-api.ccds22431.workers.dev/auth/logout | jq -e '.ok == true'
          expired=$(curl --silent --show-error --max-time 30 -o /tmp/auth-expired.json -w '%{http_code}' -H "Authorization: Bearer $new_token" https://gestock-api.ccds22431.workers.dev/auth/me)
          test "$expired" = "401"
      - name: Explain skipped deployment
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: echo "Deployment skipped. Add CLOUDFLARE_API_TOKEN in GitHub Actions secrets to enable deployment."
