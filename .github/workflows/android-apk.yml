name: Build GeStock Android APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        working-directory: mobile
        run: flutter create --platforms=android --org com.gestock --project-name gestock .

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Run Flutter tests
        working-directory: mobile
        run: flutter test

      - name: Build release APK
        working-directory: mobile
        run: >-
          flutter build apk --release
          --dart-define=GESTOCK_API_URL=https://gestock-api.ccds22431.workers.dev
          --dart-define=NEON_AUTH_URL=https://gestock-auth-proxy.ccds22431.workers.dev/auth

      - name: Rename APK for release download
        run: cp mobile/build/app/outputs/flutter-apk/app-release.apk mobile/build/app/outputs/flutter-apk/GeStock.apk

      - name: Upload APK artifact for CI download
        uses: actions/upload-artifact@v4
        with:
          name: GeStock-Android-APK
          path: mobile/build/app/outputs/flutter-apk/GeStock.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="mobile/build/app/outputs/flutter-apk/GeStock.apk"
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest "$APK" --clobber
          else
            gh release create android-latest "$APK" \
              --title "GeStock Android — dernière version" \
              --notes "APK Android généré automatiquement depuis main. Build vérifié par Flutter CI." \
              --target main
          fi
