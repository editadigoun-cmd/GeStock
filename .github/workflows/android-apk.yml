name: Build GeStock Android APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

# Serialize publishing and let the newest pending run replace older queued builds.
concurrency:
  group: gestock-android-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        working-directory: mobile
        run: flutter create --platforms=android --org com.gestock --project-name gestock .

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Run Flutter tests
        working-directory: mobile
        run: flutter test

      - name: Build release APK
        working-directory: mobile
        run: flutter build apk --release --dart-define=GESTOCK_API_URL=https://gestock-api.ccds22431.workers.dev

      - name: Verify APK signature
        run: |
          APK="mobile/build/app/outputs/flutter-apk/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Rename APK for release download
        run: cp mobile/build/app/outputs/flutter-apk/app-release.apk mobile/build/app/outputs/flutter-apk/GeStock.apk

      - name: Generate SHA-256 checksum
        run: sha256sum mobile/build/app/outputs/flutter-apk/GeStock.apk > mobile/build/app/outputs/flutter-apk/GeStock.apk.sha256

      - name: Upload APK and checksum artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeStock-Android-APK
          path: |
            mobile/build/app/outputs/flutter-apk/GeStock.apk
            mobile/build/app/outputs/flutter-apk/GeStock.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Never allow a build with stale mobile sources to overwrite the release.
          git fetch origin main --depth=1
          if ! git diff --quiet "$GITHUB_SHA" origin/main -- mobile; then
            echo "Mobile sources have changed since this build; keeping artifact but skipping release upload."
            exit 0
          fi
          APK="mobile/build/app/outputs/flutter-apk/GeStock.apk"
          CHECKSUM="$APK.sha256"
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest "$APK" "$CHECKSUM" --clobber
          else
            gh release create android-latest "$APK" "$CHECKSUM" --title "GeStock Android — dernière version" --notes "APK release généré depuis main. Le fichier SHA-256 accompagne l'APK." --target main
          fi
          mkdir -p /tmp/release-check
          gh release download android-latest --pattern "GeStock.apk" --pattern "GeStock.apk.sha256" --dir /tmp/release-check
          (cd /tmp/release-check && sha256sum -c GeStock.apk.sha256)
