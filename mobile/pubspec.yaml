version: 0.2.0+2
environment:
  sdk: ">=3.4.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_animate: ^4.5.2
  google_fonts: ^6.2.1
  go_router: ^14.8.1
  flutter_riverpod: ^2.6.1
  sqflite: ^2.4.1
